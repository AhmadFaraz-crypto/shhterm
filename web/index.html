<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>shhterm</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --line: #223042; --fg: #e6edf3;
    --dim: #7d8da3; --accent: #39d98a; --accent2: #4aa8ff; --danger: #ff6b6b;
    --dm: #d98cff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  a { color: var(--accent2); }

  /* ---- Join screen ---- */
  #join {
    margin: auto; width: min(440px, 92vw);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 26px;
  }
  #join h1 { margin: 0 0 4px; font-size: 24px; }
  #join .lock { color: var(--accent); }
  #join p.sub { margin: 0 0 20px; color: var(--dim); font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  input[type=text] {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #0c1420; color: var(--fg);
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent2); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    flex: 1; text-align: center; padding: 9px; border-radius: 9px;
    border: 1px solid var(--line); background: #0c1420; color: var(--dim);
    cursor: pointer; user-select: none;
  }
  .tab.active { border-color: var(--accent); color: var(--fg); background: #10241c; }
  button.primary {
    width: 100%; padding: 12px; border: none; border-radius: 9px;
    background: var(--accent); color: #042d1b; font: inherit; font-weight: 700;
    cursor: pointer;
  }
  button.primary:active { transform: translateY(1px); }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 6px; }

  /* ---- Chat screen ---- */
  #chat { display: none; flex-direction: column; height: 100%; width: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding-top: max(10px, env(safe-area-inset-top));
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  header .dot.ok { background: var(--accent); }
  header .dot.bad { background: var(--danger); }
  header .dot.wait { background: #e3b341; }
  header .status { font-weight: 700; }
  header .spacer { flex: 1; }
  header .meta { color: var(--dim); font-size: 12px; }
  header button {
    background: #0c1420; color: var(--dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; font: inherit; cursor: pointer;
  }

  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; }
  .msg { margin: 2px 0; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg .body { white-space: pre-wrap; }  /* preserve newlines / multi-paragraph */
  .msg .time { color: var(--dim); font-size: 11px; margin-right: 6px; }
  .msg .who { font-weight: 700; }
  .msg.system { color: var(--dim); }
  .msg.dm .body { color: var(--dm); }
  .msg .mark { font-size: 12px; margin-left: 6px; }
  .msg .mark.ok { color: var(--accent); }
  .msg .mark.pending { color: var(--dim); }
  .msg .mark.fail { color: var(--danger); }
  .keyline {
    background: #0c1420; border: 1px dashed var(--line); border-radius: 8px;
    padding: 8px 10px; margin: 6px 0; display: flex; align-items: center; gap: 8px;
  }
  .keyline code { flex: 1; word-break: break-all; color: var(--accent); }
  .keyline button {
    background: var(--accent2); color: #04203f; border: none; border-radius: 6px;
    padding: 6px 10px; font: inherit; font-weight: 700; cursor: pointer; flex: none;
  }
  #typing { height: 18px; padding: 0 14px; color: var(--dim); font-size: 12px; }
  footer {
    display: flex; gap: 8px; padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #input {
    flex: 1; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #0c1420; color: var(--fg); font: inherit;
  }
  footer button {
    background: var(--accent); color: #042d1b; border: none; border-radius: 9px;
    padding: 0 16px; font: inherit; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div id="join">
  <h1>shhterm <span class="lock">🔒</span></h1>
  <p class="sub">End-to-end encrypted terminal-style chat. No signup — a room key is the only credential.</p>
  <div class="tabs">
    <div class="tab active" id="tab-join">Join a room</div>
    <div class="tab" id="tab-create">Create a room</div>
  </div>
  <div class="field" id="keyField">
    <label>Room key</label>
    <input type="text" id="keyInput" placeholder="paste the room key you were given" autocomplete="off" />
  </div>
  <div class="field">
    <label>Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Ali" autocomplete="off" maxlength="32" />
  </div>
  <button class="primary" id="go">Join</button>
  <div class="err" id="joinErr"></div>
</div>

<div id="chat">
  <header>
    <span class="dot" id="dot"></span>
    <span class="status" id="status">connecting…</span>
    <span class="meta">🔒 e2e</span>
    <span class="spacer"></span>
    <span class="meta" id="meta"></span>
    <button id="leaveBtn">Leave</button>
  </header>
  <div id="messages"></div>
  <div id="typing"></div>
  <footer>
    <input type="text" id="input" placeholder="Type a message, or /help" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </footer>
</div>

<script src="/shhterm.js"></script>
<script src="/app.js"></script>
</body>
</html>
